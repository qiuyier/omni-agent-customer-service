name: omni-agent-customer-service

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: omni_agent_customer_service
      POSTGRES_USER: omni_agent
      POSTGRES_PASSWORD: omni_agent_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U omni_agent -d omni_agent_customer_service
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  postgres-data:
