name: omni-agent-webchat-local

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: omni_agent_webchat_demo
      POSTGRES_USER: webchat_demo
      POSTGRES_PASSWORD: webchat_demo_local
    ports:
      - "127.0.0.1:${WEBCHAT_POSTGRES_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat_demo -d omni_agent_webchat_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - webchat-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  webchat-data:
